name: Sandforge · Action 2.0 mainline integration and pacing
on:
  pull_request:
    branches: [main]
    paths:
      - src/release-pbr/**
      - src/reborn/action-balance.ts
      - src/reborn/simulation.ts
      - src/reborn/tactical-ai.ts
      - src/reborn/audio.ts
      - scripts/webgl-preview.js
      - scripts/webgl-title-menu.js
      - scripts/webgl-combat-vfx.js
      - webgl-preview.html
      - tests/sandforge-action-balance-20261122.test.mjs
      - scripts/benchmark-sandforge-action-20261122.mjs
      - .github/workflows/sandforge-action-mainline-20261123.yml
permissions:
  contents: read
concurrency:
  group: sandforge-action-mainline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  action-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Actual game build and WebGL module graph
        run: npm run build
      - name: Action, saves, physical construction, movement and combat regressions
        run: |
          node --test \
            tests/sandforge-action-balance-20261122.test.mjs \
            tests/sandforge-webgl-simulation-speed-20261119.test.mjs \
            tests/sandforge-ai-opening-route-ranking-20261123.test.mjs \
            tests/reborn-combat-balance-20261117.test.mjs
      - name: Guard gameplay assets and abandoned cliff shaders
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          # The four pinned 1.8 WebGL assets are the only approved additions.
          sha256sum --check <<'HASHES'
          5ad36a98f3b9ac75e72825e5b23e33a3fe2958eafe35ab5c99112196486a2ff6  src/release-pbr/barracks-0.glb
          5ad36a98f3b9ac75e72825e5b23e33a3fe2958eafe35ab5c99112196486a2ff6  src/release-pbr/barracks-1.glb
          d15449fa57da69c965dbffc29468bed1c37f2805324efeaaadf757f7b28efed4  src/release-pbr/headquarters-0.glb
          b6741c0cde7211413bc2033b251b91036b35ca486c84d57303f2c6ef07af8ddb  src/release-pbr/headquarters-1.glb
          HASHES
          git diff --name-only --no-renames -z "${{ github.event.pull_request.base.sha }}" HEAD > "$RUNNER_TEMP/sandforge-paths"
          while IFS= read -r -d '' file; do
            case "$file" in
              src/release-pbr/barracks-[01].glb|src/release-pbr/headquarters-[01].glb) ;;
              *.glb|*.gltf|*webgl-desert-cliff-ground-pbr*|*webgl-raised-mesa-cliffs.js)
                echo "Protected asset or cliff renderer changed: $file" >&2
                exit 1 ;;
            esac
          done < "$RUNNER_TEMP/sandforge-paths"
  action-map-pacing:
    name: "${{ matrix.map }} · 180 seconds Classic vs Action"
    needs: action-regressions
    strategy:
      fail-fast: false
      matrix:
        map:
          - desert-strike
          - broken-empire
          - burning-horizon
          - last-stronghold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Paid, deterministic four-map AI vs player opening A/B
        env:
          ACTION_BENCHMARK_SECONDS: '180'
          ACTION_BENCHMARK_MAPS: "${{ matrix.map }}"
        run: |
          mkdir -p reports
          node scripts/benchmark-sandforge-action-20261122.mjs reports/action-${{ matrix.map }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-action-mainline-${{ matrix.map }}-${{ github.run_id }}
          path: reports/action-${{ matrix.map }}.json
          retention-days: 21
          if-no-files-found: warn
