name: Sandforge Classic Canvas archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium · Classic gameplay (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install build and browser dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Classic Canvas regression suite (explicit legacy build)
        env:
          ATLAS_BROWSER_CHANNEL: chromium
        run: |
          # One worker per runner. Four independent shards prevent the old
          # serial 45-second browser tests from exhausting a single 40m job.
          npm run build:classic
          npm --prefix tests/browser test -- --shard=${{ matrix.shard }}/4
      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reborn-browser-evidence-shard-${{ matrix.shard }}
          path: tests/browser/artifacts/
          retention-days: 7
