name: Keystone HQ opt-in preview QA
on:
  push:
    branches: ['feat/keystone-hq-preview-20261115']
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/webgl-keystone-hq.js'
      - 'scripts/webgl-battlefield.js'
      - 'scripts/webgl-portraits.js'
      - 'scripts/build.mjs'
      - 'tests/webgl-keystone-hq.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/webgl-keystone-hq.test.mjs
      - name: Confirm no commercial Keystone GLB was published
        run: test ! -f src/assets/reborn/local-keystone/A_hq_KEYSTONE.glb
