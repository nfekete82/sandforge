name: Sandforge · Live Tank Convoy Desert Strike
on:
  pull_request:
    branches: [main]
    paths:
      - tests/sandforge-desert-strike-live-tank-convoy-20261123.test.mjs
      - tests/sandforge-cliff-separation-20261123.test.mjs
      - tests/sandforge-mesa-ramp-replan-stability-20261123.test.mjs
      - .github/workflows/sandforge-live-convoy-20261123.yml
      - src/reborn/world.ts
      - src/reborn/raised-mesas.ts
      - src/reborn/simulation.ts
permissions:
  contents: read
jobs:
  convoy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-desert-strike-live-tank-convoy-20261123.test.mjs tests/sandforge-cliff-separation-20261123.test.mjs tests/sandforge-mesa-ramp-replan-stability-20261123.test.mjs tests/sandforge-tank-plateau-corner-contact-20261122.test.mjs
