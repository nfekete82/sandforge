name: Sandforge · Immutable source GLBs
on:
  pull_request:
    branches: [main]
    paths:
      - src/release-pbr/**
      - src/assets/reborn/buildings-3d/**
      - scripts/build.mjs
      - scripts/ensure-final-pbr-buildings.mjs
      - tests/sandforge-build-preserves-tracked-glbs-20261122.test.mjs
      - .github/workflows/sandforge-immutable-source-glbs-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-build-preserves-tracked-glbs-20261122.test.mjs
      - name: Check no tracked files changed during build
        run: git diff --exit-code -- src/assets/reborn/buildings-3d src/release-pbr
