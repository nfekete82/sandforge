name: Sandforge authored desert hamlets QA
on:
  push:
    branches: [fix/authored-desert-villages-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandforge-authored-desert-villages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authored-hamlets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:3d
      - name: Verify actual player map seeds, styled ruins, and subtle sand tracks
        run: node --test tests/webgl-desert-villages-palette-20261115.test.mjs
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: |
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Render real authored ruin GLTFs in WebGL2
        env:
          ATLAS_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-authored-desert-villages-20261115.spec.mjs --config=playwright.config.mjs
      - name: Save errors on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-authored-village-qa
          path: tests/browser/artifacts/
          retention-days: 7
