name: Sandforge authored supply 3D GLB + refilling economy QA
on:
  push:
    branches: [feat/sandforge-supply-pbr-animated-20261117]
  pull_request:
    branches: [integration/sandforge-current-20261117]
    paths:
      - 'scripts/generate-supply-pbr.mjs'
      - 'scripts/webgl-supply-logistics.js'
      - 'scripts/webgl-battlefield.js'
      - 'scripts/build.mjs'
      - 'src/reborn/supply-logistics.ts'
      - 'src/reborn/simulation.ts'
      - 'tests/reborn-supply-pbr-glbs-20261117.test.mjs'
      - 'tests/reborn-supply-logistics-20261117.test.mjs'
      - '.github/workflows/sandforge-supply-pbr-qa-20261117.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authored-logistics:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile the authoritative economy and AI
        run: npx tsc -p tsconfig.json
      - name: Generate all three real GLBs from committed source
        run: |
          mkdir -p dist/supply-pbr-qa
          node scripts/generate-supply-pbr.mjs dist/supply-pbr-qa
      - name: Check WebGL JS syntax and all GLB contents
        run: |
          node --check scripts/webgl-battlefield.js
          node --check scripts/webgl-supply-logistics.js
          node --test \
            tests/reborn-supply-pbr-glbs-20261117.test.mjs \
            tests/reborn-supply-logistics-20261117.test.mjs \
            tests/sandforge-building-victory-20261117.test.mjs
      - name: Validate recursive browser import graph
        run: |
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --no-warnings --experimental-vm-modules scripts/check-webgl-module-graph.mjs
