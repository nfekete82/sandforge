name: Sandforge authored wind-sand PBR QA
on:
  push:
    branches: [feat/desert-authored-pbr-sand-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandforge-authored-sand-pbr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authored-pbr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:3d
      - name: Verify real authored WebP and aligned 3D sand material
        run: |
          node --test \
            tests/webgl-authored-sand-pbr-20261115.test.mjs \
            tests/webgl-desert-no-white-blotches-20261115.test.mjs \
            tests/webgl-unified-desert-scenery-style-20261115.test.mjs \
            tests/webgl-desert-villages-palette-20261115.test.mjs
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: |
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Verify real PBR albedo/normal/roughness in 4-bastion WebGL
        env:
          ATLAS_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-desert-no-white-blotches-20261115.spec.mjs --config=playwright.config.mjs
      - name: Store diagnostics if any PBR regression fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-authored-sand-pbr-qa
          path: tests/browser/artifacts/
          retention-days: 7
