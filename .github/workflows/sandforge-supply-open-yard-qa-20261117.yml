name: Sandforge supply truck and open concrete depot QA
on:
  push:
    branches: [fix/sandforge-supply-truck-open-depot-20261117]
  pull_request:
    branches: [feat/sandforge-supply-pbr-animated-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logistics-art-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile TypeScript simulation and engine sound
        run: npx tsc -p tsconfig.json
      - name: Generate authored truck and roofless depot GLBs
        run: |
          mkdir -p dist/supply-pbr-qa
          node scripts/generate-supply-pbr.mjs dist/supply-pbr-qa
      - name: Syntax and regression tests
        run: |
          for src in scripts/webgl-supply-custom.js scripts/webgl-supply-logistics.js scripts/webgl-battlefield.js scripts/webgl-ground-tracks.js scripts/webgl-vehicle-dust.js scripts/webgl-global-catalog.js scripts/generate-supply-pbr.mjs; do node --check "$src"; done
          node --test tests/reborn-supply-pbr-glbs-20261117.test.mjs tests/reborn-supply-logistics-20261117.test.mjs tests/sandforge-supply-open-yard-vehicle-20261117.test.mjs
      - name: Browser module packaging
        run: |
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --no-warnings --experimental-vm-modules scripts/check-webgl-module-graph.mjs
