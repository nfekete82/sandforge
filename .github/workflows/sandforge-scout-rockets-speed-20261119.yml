name: Sandforge transport helicopter rockets and speed QA
on:
  push:
    branches: ['feat/sandforge-scout-rockets-speed-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helicopter-rockets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile and audit browser modules without Mac-local PBR source
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: Rocket and AI regression tests
        run: |
          node --test \
            tests/sandforge-scout-rocket-support-20261119.test.mjs \
            tests/sandforge-ai36-endgame-route-recovery-20261119.test.mjs \
            tests/sandforge-ai36-recon-bomber-support-20261119.test.mjs \
            tests/sandforge-ai36-fight-dont-flee-20261119.test.mjs \
            tests/sandforge-combat-aftermath-v1-20261119.test.mjs \
            tests/webgl-aircraft-effects-20261110.test.mjs
      - name: Simulate 4 AI battles with the improved helicopter
        run: |
          node scripts/ai-test-arena.mjs \
            --maps 24,26 --seeds 2026,2027 \
            --seconds 240 --modes director --ai36 coordinated \
            --label ai36-scout-rockets-speed \
            --output ai-arena-results/ci-heli-rockets.json
      - name: Save simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-transport-heli-rockets-qa
          path: ai-arena-results/ci-heli-rockets.*
          if-no-files-found: warn
