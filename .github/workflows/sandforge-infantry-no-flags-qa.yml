name: Sandforge infantry flag removal QA
on:
  push:
    branches: [fix/webgl-infantry-no-floating-flags-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandforge-infantry-no-flags-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-markings:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:3d
      - name: Verify original blue/red infantry paint without floating team geometry
        run: node --test tests/webgl-team-markings-20261111.test.mjs tests/webgl-faction-accents-20261108.test.mjs
