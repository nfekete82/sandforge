name: Sandforge desert hamlets and palette QA
on:
  push:
    branches: [feat/desert-village-palette-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandforge-desert-village-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desert-villages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:3d
      - name: Verify seeded hamlets, conforming roads and palette on actual player maps
        run: node --test tests/webgl-desert-villages-palette-20261115.test.mjs tests/webgl-desert-rock-crater-polish-20261110.test.mjs
