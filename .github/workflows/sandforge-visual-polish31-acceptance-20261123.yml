name: Sandforge · Visual Polish 3.1 paired A/B + 60 vehicle stress
# Heavy 600-frame/60-vehicle software-render runs are opt-in, not a
# mandatory PR check. Repeated automatic attempts saturated Actions runners
# and cannot establish native Apple Metal GPU 1%-lows anyway.
# Native acceptance is documented in the visual-polish31 QA readme.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-graphics:
    name: ${{ matrix.name }} · 600-frame A/B
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desert-strike
            maps: desert-strike
            stress: '0'
            variants: before,after,after,before
          - name: broken-empire
            maps: broken-empire
            stress: '0'
            variants: before,after,after,before
          - name: burning-horizon
            maps: burning-horizon
            stress: '0'
            variants: before,after,after,before
          - name: 60-vehicles
            maps: broken-empire
            stress: '1'
            variants: before,after
    env:
      POLISH31_FRAMES: '600'
      POLISH31_VARIANTS: ${{ matrix.variants }}
      POLISH31_PROFILE: '1'
      POLISH31_VIEWPORT: 960x600
      POLISH31_SOFTWARE_QA: '1'
      POLISH31_VARIANT_TIMEOUT_MS: '720000'
      POLISH31_MAPS: ${{ matrix.maps }}
      POLISH31_STRESS: ${{ matrix.stress }}
      POLISH31_CHANNEL: chromium
      POLISH31_URL: http://127.0.0.1:8129
      POLISH31_BASE_REF: ${{ github.event.pull_request.base.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned game and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Build and validate A/B harness
        run: |
          npm run build
          node --check scripts/qa-visual-polish31.mjs
          node --check scripts/compare-visual-polish31-acceptance.mjs
      - name: Paired complete renderer and heavy combat benchmarks
        run: |
          set -euo pipefail
          PORT=8129 HOST=127.0.0.1 node scripts/serve.mjs >/tmp/sandforge-polish31-ci.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8129/healthz >/dev/null 2>&1; then READY=1; break; fi
            sleep .5
          done
          if [ "$READY" != 1 ]; then cat /tmp/sandforge-polish31-ci.log; exit 1; fi
          POLISH31_OUTPUT=artifacts/visual31/${{ matrix.name }} node scripts/qa-visual-polish31.mjs
          node scripts/report-visual-polish31-spikes.mjs \
            artifacts/visual31/${{ matrix.name }}/report.json artifacts/visual31/${{ matrix.name }}/frame-summary.json
          node scripts/compare-visual-polish31-acceptance.mjs \
            artifacts/visual31/${{ matrix.name }}/report.json artifacts/visual31/${{ matrix.name }}/acceptance.json
      - name: Summarize measured performance (not unconditional approval)
        if: always()
        run: |
          for f in artifacts/visual31/*/acceptance.json; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo '1%-Lows are descriptive; two samples per variant cannot prove significance. Manual merge approval required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload real browser before/after and stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-visual31-${{ matrix.name }}-${{ github.run_id }}
          path: artifacts/visual31/
          retention-days: 21
          if-no-files-found: warn
