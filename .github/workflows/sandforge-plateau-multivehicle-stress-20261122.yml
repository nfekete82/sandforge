name: Sandforge · Plateau multi-vehicle stress
on:
  pull_request:
    branches: [main]
    paths:
      - tests/sandforge-plateau-multivehicle-stress-20261122.test.mjs
      - .github/workflows/sandforge-plateau-multivehicle-stress-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-plateau-multivehicle-stress-20261122.test.mjs
