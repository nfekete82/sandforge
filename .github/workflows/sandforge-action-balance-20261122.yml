name: Sandforge Action 2.0 - classic vs action pacing
on:
  pull_request:
    branches:
      - feat/sandforge-natural-cliff-dressing-20261122
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: action-pacing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  action-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build WebGL and simulation
        run: npm run build
      - name: Classic save / Action paid production / map AI regression
        run: |
          node --test \
            tests/sandforge-action-balance-20261122.test.mjs \
            tests/sandforge-desert-strike-integrated-cliff-pbr-20261122.test.mjs
      - name: Four authored desert maps, same world, Classic vs Action
        env:
          ACTION_BENCHMARK_SECONDS: '360'
        run: node scripts/benchmark-sandforge-action-20261122.mjs reports/sandforge-action-pacing-20261122.json
      - name: Upload reproducible measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-action-pacing-4-maps
          path: reports/sandforge-action-pacing-20261122.json
          if-no-files-found: warn
          retention-days: 30
