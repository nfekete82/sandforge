name: Sandforge factory open service platform QA
on:
  push:
    branches: [fix/factory-open-repair-platform-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandforge-open-factory-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  factory-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:3d
      - name: Open-air platform, paid repair, old save bays and original production portal
        run: |
          node --test \
            tests/webgl-factory-open-repair-platform-20261115.test.mjs \
            tests/webgl-hangar-factory-maintenance-20261110.test.mjs \
            tests/webgl-production-gates.test.mjs
      - run: npm ci --prefix tests/browser --no-audit --no-fund
      - run: |
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Real factory GLB and open repair deck in WebGL2
        env:
          ATLAS_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-factory-open-service-platform-20261115.spec.mjs webgl-factory-queued-rollouts-lite-20261115.spec.mjs --config=playwright.config.mjs
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-factory-open-platform-qa
          path: tests/browser/artifacts/
          retention-days: 7
