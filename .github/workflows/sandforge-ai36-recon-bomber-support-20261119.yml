name: Sandforge KI 3.6 reconnaissance and air support QA
on:
  push:
    branches: ['feat/sandforge-ai36-recon-bomber-support-20261119']
  pull_request:
    branches: ['feat/sandforge-ai36-fight-dont-flee-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  air-support:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile game and validate WebGL browser graph
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: Verify paid R-01, bomber sorties, crash and AI3.6 fight logic
        run: |
          node --test \
            tests/sandforge-ai36-recon-bomber-support-20261119.test.mjs \
            tests/sandforge-recon-drone.test.mjs \
            tests/sandforge-ai-antiarmor-air-defense-20261111.test.mjs \
            tests/reborn-ai-ignore-drone-20261118.test.mjs \
            tests/sandforge-ai36-fight-dont-flee-20261119.test.mjs \
            tests/sandforge-combat-aftermath-v1-20261119.test.mjs \
            tests/webgl-aircraft-effects-20261110.test.mjs
