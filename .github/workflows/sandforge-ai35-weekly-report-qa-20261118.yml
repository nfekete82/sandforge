name: Sandforge AI 3.5 Weekly Ranking QA
on:
  push:
    branches: ['feat/sandforge-weekly-ai35-roster-20261118']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  reporter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify provisional leaderboard, paired maps and policy labels
        run: node --test .github/scripts/weekly-report.test.mjs
      - name: Check report script syntax
        run: node --check .github/scripts/weekly-report.mjs
