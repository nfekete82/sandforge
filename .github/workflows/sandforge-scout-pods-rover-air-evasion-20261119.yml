name: Sandforge compact heli pods and lone-jeep air evasion
on:
  push:
    branches: ['feat/sandforge-scout-pods-lone-rover-air-evasion-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jeep-vs-heli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript compile and complete browser module audit
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: New pods and air escape, existing helicopter, bomber and AI tests
        run: |
          node --test \
            tests/sandforge-scout-pods-rover-air-evasion-20261119.test.mjs \
            tests/sandforge-scout-rocket-support-20261119.test.mjs \
            tests/sandforge-bomber-escort-heli-mg-20261119.test.mjs \
            tests/sandforge-ai36-fight-dont-flee-20261119.test.mjs \
            tests/sandforge-ai36-recon-bomber-support-20261119.test.mjs \
            tests/sandforge-ai36-endgame-route-recovery-20261119.test.mjs \
            tests/webgl-aircraft-effects-20261110.test.mjs
      - name: KI 3.6 240s smoke games on both major maps
        run: |
          node scripts/ai-test-arena.mjs \
            --maps 24,26 --seeds 2026,2027 \
            --seconds 240 --modes director --ai36 coordinated \
            --label ai36-small-pods-air-evasion \
            --output ai-arena-results/ci-ai36-small-pods-air-evasion.json
      - name: Save battle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-small-pods-jeep-air-evasion
          path: ai-arena-results/ci-ai36-small-pods-air-evasion.*
          if-no-files-found: warn
