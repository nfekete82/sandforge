name: Sandforge AI33 Drone HUD and Unstick QA
on:
  push:
    branches: ['feat/sandforge-ai33-drone-hud-ai-unstick-20261118']
  pull_request:
    branches: ['feat/sandforge-ai33-local-lab-20261118']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai33-hud-unstick:
    name: 3D drone HUD, AI construction and march watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and 3D module graph
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --check scripts/webgl-portraits.js
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: Targeted simulation and HUD regression tests
        run: |
          node --test \
            tests/sandforge-ai33-drone-hud-unstick-20261118.test.mjs \
            tests/sandforge-ai33-bastion-near-capture-20261118.test.mjs \
            tests/reborn-ai-ignore-drone-20261118.test.mjs \
            tests/sandforge-recon-drone.test.mjs \
            tests/sandforge-ai33-map-adaptive-20261118.test.mjs \
            tests/sandforge-ai32-multifront-20261117.test.mjs \
            tests/reborn-bastion-priority-20261117.test.mjs \
            tests/webgl-building-portrait-readability.test.mjs \
            tests/sandforge-engineer-sequential-orders.test.mjs
