name: Validate 11 Nov Bastion cleanup and safe performance fixes
on:
  push:
    branches: [fix/bastion-clean-base-perf-20261115]
    paths: [.github/workflows/validate-bastion-cleanup-20261115.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile full game on November 11 visual baseline
        run: npm run build:3d
      - name: Verify targeted Bastion mesh, geometry and CPU optimizations
        run: |
          node --test tests/webgl-bastion-base-cleanup-perf-20261115.test.mjs \
            tests/webgl-graded-bastion-pads-20261111.test.mjs \
            tests/webgl-late-match-combat-input-20261111.test.mjs \
            tests/sandforge-bastion-navigation.test.mjs \
            tests/webgl-300s-performance.test.mjs
      - name: Check built frontend includes the cleaned Bastion module
        run: |
          test -s dist/webgl-bastion-visual.js
          grep -q removeBastionFrontShield dist/webgl-battlefield.js
          test -s dist/src/assets/reborn/buildings-3d/bastion-0.glb
      - name: Run end-to-end system integration smoke
        run: npm run test:webgl-integration
