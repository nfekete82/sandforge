name: Sandforge · Humvee / tank / infantry proportions
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/webgl-scale.js
      - tests/sandforge-webgl-humvee-tank-infantry-proportions-20261122.test.mjs
      - .github/workflows/sandforge-webgl-humvee-tank-infantry-proportions-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proportions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-webgl-humvee-tank-infantry-proportions-20261122.test.mjs tests/sandforge-base-proportions-bomber-stripes-20261121.test.mjs
