name: Sandforge AI 3.7 fortification and Bastion defense
on:
  push:
    branches:
      - feat/sandforge-ai37-bunker-bastion-defense-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai37-fortification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript build, WebGL and module graph
        run: |
          npx tsc -p tsconfig.json
          node --check scripts/webgl-battlefield.js
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: AI defense, bunker, economy and navigation regressions
        run: |
          node --test \
            tests/sandforge-ai37-fortification-doctrine-20261120.test.mjs \
            tests/sandforge-bunker-bastion-audio-20261119.test.mjs \
            tests/sandforge-battle-director-mountain-20261119.test.mjs \
            tests/sandforge-ai36-recon-bomber-support-20261119.test.mjs \
            tests/sandforge-ai36-terrain-routes-20261119.test.mjs \
            tests/sandforge-diverse-landscapes-v4-20261119.test.mjs
