name: Sandforge 3 authored maps - real WebGL screenshots
on:
  push:
    branches:
      - feat/sandforge-three-curated-maps-ai-training-20261120
  workflow_dispatch:
concurrency:
  group: sandforge-curated-screenshots-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  graphical-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install game and Chromium screenshot test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Build real WebGL module graph without requiring private PBR authorship
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          mkdir -p dist/src
          cp -a src/assets dist/src/assets
          node scripts/generate-oasis-adobe-glbs.mjs dist/src/assets/reborn/oasis-village
      - name: Actual Chromium WebGL screenshots, texture and collision sanity
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-curated-battlefields.spec.mjs --config=playwright.config.mjs
      - name: Save six high-resolution actual game and landmark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-curated-three-maps-webgl-screenshots
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
