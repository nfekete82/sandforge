name: Sandforge AI4.1 static vs physical canyon route probe
on:
  push:
    branches: [diag/sandforge-ai41-hq-route-coverage-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - name: Compare public static full and partial paths using physical footprints and slopes
        run: node scripts/diag-ai41-map26-ground-routes-20261120.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandforge-ai41-static-ground-routes
          path: reports/ai41-ground-route-static.json
          if-no-files-found: error
          retention-days: 21
