        run: |
          set -euo pipefail
          mkdir -p src/assets/reborn/buildings-3d/meshy-structures
          for kind in barracks airfield bastion bunker headquarters generator; do
            var="SF_${kind^^}_URL"
            url="${!var}"
            curl --fail --location --silent --show-error --retry 3 --max-time 300 \
              "$url" -o "src/assets/reborn/buildings-3d/meshy-structures/$kind.glb"
          done
      - name: Validate all real GLB files and avoid 100MB GitHub blob limit
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,statSync} from 'node:fs';
          for(const kind of 'barracks airfield bastion bunker headquarters generator'.split(' ')){
            const path='src/assets/reborn/buildings-3d/meshy-structures/'+kind+'.glb';
            const b=readFileSync(path);
            if(b.toString('ascii',0,4)!=='glTF'||b.readUInt32LE(4)!==2||
               b.readUInt32LE(8)!==b.length||b.length<50_000||
               b.length>90_000_000)throw Error('Invalid GLB: '+path);
            const len=b.readUInt32LE(12);
            const doc=JSON.parse(b.toString('utf8',20,20+len));
            if(!doc.meshes?.length||!doc.materials?.length)
              throw Error('Missing Meshy mesh/PBR material: '+kind);
            console.log(kind,statSync(path).size,'bytes',doc.meshes.length,'meshes');
          }
          NODE
      - name: Commit stable GLB binaries to this test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/reborn/buildings-3d/meshy-structures/
          if git diff --cached --quiet; then
            echo "Meshy models already imported"
          else
            git commit -m "assets(meshy): import six PBR building models [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
