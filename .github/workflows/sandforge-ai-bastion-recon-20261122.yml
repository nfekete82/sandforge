name: Sandforge · Bastion reconnaissance before assault
on:
  pull_request:
    branches: [main]
    paths:
      - src/reborn/ai-bastion-recon.ts
      - src/reborn/tactical-ai.ts
      - src/reborn/campaign-commander.ts
      - tests/sandforge-ai-bastion-recon-fog-20261122.test.mjs
      - .github/workflows/sandforge-ai-bastion-recon-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bastion-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Fog, scouting and neutral expansion regressions
        run: |
          node --test \
            tests/sandforge-ai-bastion-recon-fog-20261122.test.mjs \
            tests/sandforge-ai-neutral-expansion-20261115.test.mjs
