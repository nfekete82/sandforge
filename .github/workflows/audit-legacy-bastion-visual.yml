name: Inspect legacy bastion mesh for safe removal
on:
  push:
    branches: [fix/bastion-clean-base-perf-20261115]
    paths: [.github/workflows/audit-legacy-bastion-visual.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Analyze November 11 Bastion GLB hierarchy and draw calls
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const p='src/assets/reborn/buildings-3d/bastion-0.glb';
          const f=readFileSync(p);
          const gltf=JSON.parse(f.subarray(20,20+f.readUInt32LE(12)).toString('utf8'));
          console.log('GLTF:',JSON.stringify({bytes:f.length,meshes:gltf.meshes?.length,nodes:gltf.nodes?.length,scenes:gltf.scenes?.length,skins:gltf.skins?.length,animations:gltf.animations?.map(x=>x.name),materials:gltf.materials?.length}));
          const parents=new Map();
          gltf.nodes.forEach((n,i)=>(n.children||[]).forEach(c=>parents.set(c,i)));
          for(let i=0;i<gltf.nodes.length;i++){
            const n=gltf.nodes[i];const m=gltf.meshes?.[n.mesh];
            const props={id:i,name:n.name||null,parent:parents.get(i),parentName:gltf.nodes[parents.get(i)]?.name,mesh:n.mesh,meshName:m?.name,
              translate:n.translation,scale:n.scale,rotate:n.rotation,materials:(m?.primitives||[]).map(p=>gltf.materials?.[p.material]?.name),
              bounds:(m?.primitives||[]).map(p=>{const a=gltf.accessors?.[p.attributes?.POSITION];return a?[a.min,a.max]:null;})};
            console.log('NODE',JSON.stringify(props));
          }
          const binStart=28+f.readUInt32LE(12);
          const getAccessor=id=>{
           const a=gltf.accessors[id],view=gltf.bufferViews[a.bufferView];
           const n=a.type==='VEC3'?3:1;
           const bytes=a.componentType===5126||a.componentType===5125?4:a.componentType===5123?2:1;
           const stride=view.byteStride??bytes*n;
           const base=binStart+view.byteOffset+(a.byteOffset||0);
           const read=(idx,axis=0)=>{
            const at=base+idx*stride+axis*bytes;
            if(a.componentType===5126)return f.readFloatLE(at);
            if(a.componentType===5125)return f.readUInt32LE(at);
            if(a.componentType===5123)return f.readUInt16LE(at);
            return f.readUInt8(at);
           };
           return {a,read};
          };
          const steel=gltf.meshes[48];
          for(const primitive of steel.primitives){
           const v=getAccessor(primitive.attributes.POSITION);
           const ind=primitive.indices!==undefined?getAccessor(primitive.indices):null;
           const tris=(ind?.a.count??v.a.count)/3;
           const getIdx=i=>ind?ind.read(i):i;
           const parent=Array.from({length:v.a.count},(_,i)=>i);
           const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));
           const union=(i,j)=>{i=find(i);j=find(j);if(i!==j)parent[j]=i};
           for(let t=0;t<tris;t++){const i=getIdx(t*3);union(i,getIdx(t*3+1));union(i,getIdx(t*3+2))}
           const groups=new Map();
           for(let t=0;t<tris;t++){
            const i=getIdx(t*3),key=find(i);
            let b=groups.get(key);
            if(!b){b={count:0,min:[Infinity,Infinity,Infinity],max:[-Infinity,-Infinity,-Infinity]};groups.set(key,b)}
            b.count++;
            for(let j=0;j<3;j++){
             const idx=getIdx(t*3+j);
             for(let axis=0;axis<3;axis++){
              const val=v.read(idx,axis);
              b.min[axis]=Math.min(b.min[axis],val);
              b.max[axis]=Math.max(b.max[axis],val);
             }
            }
           }
           console.log('STEEL_COMPONENTS',JSON.stringify({tris,components:[...groups.values()].sort((a,b)=>b.count-a.count)}));
          }
          NODE
