name: Sandforge · Legacy AI Regression Triage
on:
  pull_request:
    branches: [main]
    paths:
      - tests/reborn-combat-missions.test.mjs
      - tests/reborn-commander.test.mjs
      - .github/workflows/sandforge-legacy-ai-regression-20261123.yml
permissions:
  contents: read
jobs:
  combat-commander:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/reborn-combat-missions.test.mjs tests/reborn-commander.test.mjs
