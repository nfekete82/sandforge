name: Install Sandforge low-poly Feldkommando GLB
on:
  push:
    branches:
      - feat/final-feldkommando-user-glb-20261114
    paths:
      - .asset-transfer/sandforge-lowpoly-hq/**
      - .github/workflows/install-lowpoly-hq.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify exact authored asset
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import lzma
          import pathlib
          src = pathlib.Path(".asset-transfer/sandforge-lowpoly-hq")
          compressed = "".join((src / f"part-{i}.b85").read_text() for i in range(3))
          binary = lzma.decompress(base64.b85decode(compressed))
          sha = hashlib.sha256(binary).hexdigest()
          expected = "9510d83548e798a3daf42e139a5984255b33088ccda3cda7d761b1b920dea3b9"
          assert sha == expected, f"GLB transfer SHA mismatch: {sha}"
          assert binary[:4] == b"glTF" and int.from_bytes(binary[8:12],"little") == len(binary)
          target = pathlib.Path("src/assets/reborn/buildings-3d/sandforge_feldkommando_lowpoly_1geschoss.glb")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(binary)
          print(f"Verified: {target}, {len(binary)} bytes, SHA-256: {sha}")
          PY
      - name: Commit verified GLB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/reborn/buildings-3d/sandforge_feldkommando_lowpoly_1geschoss.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(hq): install checked single-storey low-poly Feldkommando"
            git push origin HEAD:feat/final-feldkommando-user-glb-20261114
          fi
