name: Mesa Highlands · physical cliff and tank-ramp smoke
on:
  push:
    branches:
      - feat/sandforge-playable-elevated-mesas-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mesa:
    name: V7 heightfield, plateau topology and 3D terrain
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build Sandforge and generated 3D assets
        run: npm run build
      - name: Verify 3 real-plateau simulation and PBR regression tests
        run: node --test tests/sandforge-playable-mesa-highlands-20261121.test.mjs
      - name: Verify original Plateau Crossroads is unchanged
        run: node --test tests/sandforge-authored-plateau-crossroads-20261121.test.mjs
