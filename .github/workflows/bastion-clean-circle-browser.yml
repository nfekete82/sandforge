name: Bastion clean-circle live browser acceptance
on:
  push:
    branches: [fix/bastion-clean-base-perf-20261115]
    paths: [.github/workflows/bastion-clean-circle-browser.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:3d
      - run: npm --prefix tests/browser ci
      - run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Test actual Bastion mesh and radar in Chromium WebGL
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          SANDFORGE_TEST_PORT: '8205'
        run: node tests/browser/node_modules/playwright/cli.js test --config=tests/browser/playwright.config.mjs webgl-bastion-clean-base-20261115.spec.mjs
      - name: Keep failure screenshot and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bastion-clean-circle-browser
          path: |
            tests/browser/artifacts/report
            tests/browser/artifacts/runs
            tests/browser/artifacts/results.json
          if-no-files-found: ignore
          retention-days: 4
