name: Sandforge · Real Mesa Tank Routing
on:
  pull_request:
    branches: [main]
    paths:
      - src/reborn/raised-mesas.ts
      - src/reborn/world.ts
      - tests/sandforge-real-mesa-tank-routing-20261123.test.mjs
      - .github/workflows/sandforge-real-mesa-tank-routing-20261123.yml
permissions:
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/sandforge-real-mesa-tank-routing-20261123.test.mjs tests/sandforge-tank-plateau-corner-contact-20261122.test.mjs
