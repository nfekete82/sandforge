name: Sandforge Low-Poly Soldier Browser Acceptance
on:
  push:
    branches: [feat/lowpoly-soldier-rig-animations-20261115]
    paths: [.github/workflows/lowpoly-soldier-browser-acceptance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build game with the final animated soldier
        run: npm run build:3d
      - name: Set up Playwright
        run: npm --prefix tests/browser install --no-audit --no-fund
      - name: Install Chromium
        run: cd tests/browser && npx playwright install --with-deps chromium
      - name: Real WebGL loader, skeleton, faction tint and movement QA
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          SANDFORGE_TEST_PORT: '8201'
        run: node tests/browser/node_modules/playwright/cli.js test --config=tests/browser/playwright.config.mjs webgl-lowpoly-soldier-20261115.spec.mjs
      - name: Save browser QA traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowpoly-soldier-webgl-qa
          path: |
            tests/browser/artifacts/report
            tests/browser/artifacts/runs
            tests/browser/artifacts/results.json
          if-no-files-found: ignore
          retention-days: 7
