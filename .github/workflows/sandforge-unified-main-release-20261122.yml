name: Sandforge integrated release · infantry + map + HUD
on:
  push:
    branches:
      - integration/sandforge-unified-infantry-cliffs-hud-20261122
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consolidated:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Compile integrated game engine, WebGL and GLB assets
        run: npm run build
      - name: Human soldier roles, physical PBR models and actual HUD portraits
        run: node --test tests/webgl-human-infantry-20261121.test.mjs
      - name: Bastion 3D click-upgrade, 750 credits, ownership and save data
        run: node --test tests/sandforge-bastion-direct-click-upgrade-hud-20261122.test.mjs
      - name: New natural Desert Strike cliffs, 4-ramp central plateau and vehicle navigation
        run: node --test tests/sandforge-desert-strike-natural-cliffs-20261122.test.mjs tests/sandforge-central-four-ramp-mesas-v10-20261121.test.mjs
      - name: Preserve main-only weekly AI ranking and fairness tests
        run: node --test .github/scripts/weekly-report.test.mjs
      - name: Five old maps, heights and historical save compatibility
        run: node --test tests/sandforge-four-desert-maps-20261120.test.mjs tests/sandforge-five-deserts-height-relief-v8-20261121.test.mjs tests/sandforge-playable-mesa-highlands-20261121.test.mjs
