name: Sandforge four real textured desert landscapes - Chromium screenshots
on:
  push:
    branches: [feat/sandforge-four-authentic-desert-3d-environments-20261120]
    paths:
      - .github/workflows/sandforge-authentic-desert-webgl-screenshots.yml
      - tests/browser/webgl-authentic-desert-ecoregions.spec.mjs
      - scripts/webgl-desert-ecoregion-3d.js
      - scripts/webgl-desert-ground-pbr.js
      - scripts/webgl-preview.js
      - src/assets/reborn/desert-ecoregions/**
      - src/assets/reborn/terrain/desert-*.webp
  workflow_dispatch:
concurrency:
  group: sandforge-authentic-desert-webgl-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real-chromium-four-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install authoritative game and Chromium software GPU
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Compile game and copy actual committed high-quality PBR assets
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          mkdir -p dist/src
          cp -a src/assets dist/src/assets
          node scripts/generate-oasis-adobe-glbs.mjs dist/src/assets/reborn/oasis-village
      - name: Render four real Three.js WebGL2 battlefields with native plants and PBR soil
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-authentic-desert-ecoregions.spec.mjs --config=playwright.config.mjs
      - name: Store 12 real rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-four-authentic-desert-pbr-screenshots
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
