name: Optimize heavy Meshy vehicle factory to RTS-ready GLB
on:
  push:
    branches: [feat/sandforge-meshy-factory-real-glb-20261120]
permissions:
  contents: write
jobs:
  simplify-and-embed-meshy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Optimize actual Meshy geometry and compressed PBR maps
        run: |
          set -euo pipefail
          src=src/assets/reborn/buildings-3d/factory-meshy-source.glb
          dst=src/assets/reborn/buildings-3d/factory-meshy-optimized.glb
          if test ! -s "$src"; then
            echo 'No original Meshy GLB yet; source import is separate.'
            exit 0
          fi
          if test -s "$dst"; then
            echo 'Optimized Meshy GLB already committed.'
            exit 0
          fi
          curl -fLsS --retry 3 \
            https://github.com/zeux/meshoptimizer/releases/download/v1.3/gltfpack-ubuntu.zip \
            -o /tmp/gltfpack-ubuntu.zip
          mkdir -p /tmp/sandforge-gltfpack
          unzip -o /tmp/gltfpack-ubuntu.zip -d /tmp/sandforge-gltfpack
          tool=$(find /tmp/sandforge-gltfpack -type f -name 'gltfpack' | head -n 1)
          test -n "$tool"
          chmod +x "$tool"
          "$tool" -i "$src" -o "$dst" -si 0.045 -sp -tw -kn -ke
          node scripts/prepare-meshy-factory.mjs "$dst"
          node - "$src" "$dst" <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          function inspect(path){
            const b=fs.readFileSync(path);
            assert.equal(b.toString('ascii',0,4),'glTF');
            const n=b.readUInt32LE(12),j=JSON.parse(b.toString('utf8',20,20+n));
            let tri=0;
            for(const m of j.meshes??[])for(const p of m.primitives??[]){
              const acc=j.accessors[p.indices];
              if(acc)tri+=acc.count/3;
            }
            return {bytes:b.length,triangles:tri,materials:j.materials?.length,
              textures:j.textures?.length,extensions:j.extensionsUsed??[]};
          }
          const input=inspect(process.argv[2]),out=inspect(process.argv[3]);
          console.log(JSON.stringify({input,optimized:out},null,2));
          assert.ok(out.bytes<input.bytes*.45,'factory must be less than 45% source size');
          assert.ok(out.triangles<input.triangles*.20,'factory must simplify by at least 80%');
          assert.ok(out.triangles>15000,'enough geometry for detailed architecture');
          assert.ok(out.textures>=2,'preserve authored Meshy textures');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          git commit -m 'asset(meshy): version optimized PBR factory with game-ready geometry'
          git push origin HEAD:feat/sandforge-meshy-factory-real-glb-20261120
      - name: Keep the directly playable optimized mesh for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-meshy-factory-optimized-actual-3d
          path: |
            src/assets/reborn/buildings-3d/factory-meshy-optimized.glb
            src/assets/reborn/buildings-3d/factory-meshy-0.glb
          if-no-files-found: warn
          retention-days: 30
