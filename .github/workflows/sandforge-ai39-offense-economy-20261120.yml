name: Sandforge KI 3.9 offensive economy 36 paired combats
on:
  push:
    branches:
      - feat/sandforge-ai39-offense-before-bunkers-20261120
  workflow_dispatch:
concurrency:
  group: sandforge-ai39-offense-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ai39-offense:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - map: 24
            name: 8
          - map: 25
            name: 12
          - map: 26
            name: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile
        run: |
          npx tsc -p tsconfig.json
          node --check scripts/benchmark-sandforge-ai38-combat.mjs
      - name: Economy and garrison regression
        run: |
          node --test tests/sandforge-ai38-reliability-20261120.test.mjs \
            tests/sandforge-ai37-fortification-doctrine-20261120.test.mjs
      - name: Paired 480-second baseline versus delayed-bunker combats
        run: |
          mkdir -p reports
          node scripts/benchmark-sandforge-ai38-combat.mjs \
            --maps ${{ matrix.map }} \
            --seeds 824836862,9999 \
            --opponents guarded,contesting,bastion-rush \
            --seconds 480 \
            --output reports/ai39-full-${{ matrix.name }}.json
      - name: Upload complete or partial combat measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-ai39-full-${{ matrix.name }}-bastions
          path: reports/ai39-full-${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 30
