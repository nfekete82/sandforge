name: Sandforge faithful reference vehicle factory high-detail 3D PBR QA
on:
  push:
    branches: [feat/sandforge-reference-pbr-vehicle-factory-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glb-architecture-and-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and authored PBR factory texture generator syntax
        run: |
          npx tsc -p tsconfig.json
          node --check scripts/generate-factory-pbr.mjs
          node --check scripts/webgl-battlefield.js
          node --check scripts/webgl-portraits.js
      - name: Generate genuine blue and red high-detail factory-0/1 GLBs
        run: |
          node scripts/generate-bastion-radar.mjs
          node scripts/generate-factory-pbr.mjs
      - name: Verify 3D geometry, references, team stripes, real PBR maps, vehicle exits
        run: |
          node --test tests/sandforge-reference-vehicle-factory-20261120.test.mjs
          node --test tests/webgl-factory-pbr-and-faction-palette.test.mjs
          node --test tests/sandforge-open-factory-star-flags-compact-bunker-20261120.test.mjs
          node --test tests/webgl-desert-building-pbr-20261115.test.mjs
          node --test tests/webgl-production-gates.test.mjs
      - name: Verify complete bootable WebGL module graph
        run: SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
      - name: Preserve playable factory GLB assets for local inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-industrial-reference-factory-blue-red-glb
          path: |
            src/assets/reborn/buildings-3d/factory-0.glb
            src/assets/reborn/buildings-3d/factory-1.glb
          if-no-files-found: warn
          retention-days: 30
  real-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium with software GL2 renderer
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Export complete PBR model + actual game renderer
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          mkdir -p dist/src
          cp -a src/assets dist/src/assets
          node scripts/generate-factory-pbr.mjs dist/src/assets/reborn/buildings-3d
      - name: Draw factory at two real camera angles, check renderer and screenshots
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-reference-vehicle-factory-20261120.spec.mjs webgl-factory-open-service-platform-20261115.spec.mjs --config=playwright.config.mjs
      - name: Store actual front/rear 3D images and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-reference-factory-authentic-3d-screenshots
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
