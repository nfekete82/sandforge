name: Install Sandforge custom 6x6 supply-truck GLBs
on:
  push:
    branches:
      - feat/sandforge-custom-supply-6x6-hud-20261117
    paths:
      - scripts/assets/sandforge-supply-6x6-source.zlib.b64
      - scripts/generate-supply-custom.py
      - tests/sandforge-supply-custom-6x6.test.mjs
      - .github/workflows/install-supply-custom-6x6.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic mesh export dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0
      - name: Rebuild the approved user-provided 6x6 model
        run: python scripts/generate-supply-custom.py
      - name: Validate GLB and runtime JavaScript
        run: |
          node --check scripts/webgl-supply-custom.js
          node --check scripts/webgl-supply-logistics.js
          node --check scripts/webgl-battlefield.js
          node --check scripts/webgl-portraits.js
          node --test tests/sandforge-supply-custom-6x6.test.mjs
      - name: Commit generated game assets into the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/reborn/supply-custom/supply-0.glb \
                  src/assets/reborn/supply-custom/supply-1.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(supply): install actual custom 6x6 GLBs in Sandforge"
            git push
          fi
