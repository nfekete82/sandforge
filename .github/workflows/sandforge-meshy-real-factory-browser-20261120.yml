name: Sandforge real Meshy factory WebGL and original-open-bay comparison
on:
  push:
    branches: [feat/sandforge-meshy-factory-real-glb-20261120]
  workflow_dispatch:
concurrency:
  group: sandforge-meshy-3d-render-candidate-20261120
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  optimized-model-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate real PBR geometry and measured optimized triangle count
        run: |
          npx tsc -p tsconfig.json
          node --test tests/sandforge-meshy-reference-optimized-20261120.test.mjs
      - name: Test standalone Meshy preview build without private HQ and barracks GLBs
        run: |
          npm run build:meshy-preview
          node -e "const fs=require('fs');for(const f of ['dist/webgl-meshy-factory.html','dist/webgl-meshy-factory-viewer.js','dist/src/assets/reborn/buildings-3d/factory-meshy-0.glb','dist/src/assets/reborn/buildings-3d/factory-0.glb']){if(!fs.existsSync(f))throw Error('Missing preview: '+f);console.log(f,fs.statSync(f).size)}"
  real-3d-meshy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium GPU software rasterizer
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Build standalone 3D comparison viewer without HQ/Barracks dependency
        run: npm run build:meshy-preview
      - name: Verify preview HTML is served (not 404)
        run: |
          PORT=8136 node scripts/serve.mjs &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8136/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8136/webgl-meshy-factory.html
          curl -fsS -o /dev/null http://127.0.0.1:8136/src/assets/reborn/buildings-3d/factory-meshy-0.glb
      - name: Render authentic optimized Meshy 3D from front and rear
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-meshy-factory-real-20261120.spec.mjs --config=playwright.config.mjs
      - name: Save visual comparison, diagnostics and model screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-meshy71-real-factory-versus-open-game-factory
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
