name: Sandforge local Bastion defense A/B

on:
  pull_request:
    paths:
      - '.github/workflows/sandforge-bastion-local-defense-ab.yml'
  workflow_dispatch:

jobs:
  paired-local-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIR: ai-arena-results/bastion-local-defense
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile old policy with same unchanged current simulation
        shell: bash
        run: |
          set -euo pipefail
          git show a587b07bc0608a44290a3c04c28647fde5b37965:src/reborn/tactical-ai.ts > src/reborn/tactical-ai.ts
          npx tsc -p tsconfig.json
          cp -a dist dist-before
          git restore --source=HEAD -- src/reborn/tactical-ai.ts
          npx tsc -p tsconfig.json
          cmp dist-before/src/reborn/simulation.js dist/src/reborn/simulation.js
          cmp dist-before/src/reborn/catalog.js dist/src/reborn/catalog.js
          cmp dist-before/src/reborn/campaign-commander.js dist/src/reborn/campaign-commander.js
      - name: Baseline against paid territorial contestant
        shell: bash
        run: |
          mkdir -p "$DIR"
          ATLAS_SIM_MODULE="$PWD/dist-before/src/reborn/simulation.js" node scripts/ai-test-arena.mjs \
            --maps 4,23 --seeds 2026,2027 --seconds 600 \
            --modes director --opponent contesting \
            --label old-global-defense --output "$DIR/before.json"
      - name: Local-defense policy in same four real matches
        shell: bash
        run: |
          node scripts/ai-test-arena.mjs \
            --maps 4,23 --seeds 2026,2027 --seconds 600 \
            --modes director --opponent contesting \
            --label local-bastion-response --output "$DIR/after.json"
      - name: Verify matched control-time, defense, wins and troop losses
        shell: bash
        run: |
          node scripts/ai-test-arena-compare.mjs "$DIR/before.json" "$DIR/after.json" "$DIR/comparison.md"
          node scripts/ai-bastion-control-report.mjs "$DIR/before.json" "$DIR/after.json" "$DIR/territory-report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandforge-bastion-local-defense
          path: ai-arena-results/bastion-local-defense/
          if-no-files-found: warn
