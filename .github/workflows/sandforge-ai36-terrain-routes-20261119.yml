name: Sandforge AI 3.6 natural-map routes QA
on:
  push:
    branches: ['feat/sandforge-ai36-terrain-routes-20261119']
  pull_request:
    branches: ['feat/sandforge-procedural-landscape-v3-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai36-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile and verify WebGL browser module graph
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: AI 3.6, realistic mountain passes and save regressions
        run: |
          node --test \
            tests/sandforge-ai36-terrain-routes-20261119.test.mjs \
            tests/sandforge-ai36-recapture-20261118.test.mjs \
            tests/sandforge-ai36-combat-movement-20261119.test.mjs \
            tests/sandforge-natural-landscape-v3-20261119.test.mjs \
            tests/webgl-pathfinding-budget-20261111.test.mjs
      - name: Paired AI 3.5 versus 3.6 natural-map smoke benchmark
        run: SANDFORGE_BENCH_SECONDS=140 node scripts/benchmark-ai36-natural-maps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai36-natural-map-comparison
          path: docs/qa/ai36-terrain/paired-smoke.json
          if-no-files-found: ignore
