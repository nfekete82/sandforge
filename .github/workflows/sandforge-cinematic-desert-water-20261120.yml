name: Sandforge cinematic animated lakes and rivers - four desert QA
on:
  push:
    branches: [feat/sandforge-cinematic-desert-lakes-rivers-20261120]
    paths:
      - .github/workflows/sandforge-cinematic-desert-water-20261120.yml
      - scripts/webgl-desert-water-plan.js
      - scripts/webgl-desert-water-3d.js
      - scripts/webgl-preview.js
      - scripts/build.mjs
      - tests/sandforge-cinematic-desert-water-20261120.test.mjs
      - tests/browser/webgl-cinematic-desert-water-20261120.spec.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-geometry-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile simulation and check browser JS syntax
        run: |
          npx tsc -p tsconfig.json
          node --check scripts/webgl-desert-water-plan.js
          node --check scripts/webgl-desert-water-3d.js
      - name: Verify deterministic lakes, winding rivers, safety and PBR
        run: node --test tests/sandforge-cinematic-desert-water-20261120.test.mjs
      - name: Check full WebGL ESM graph without private local GLB builds
        run: SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
  real-water-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install game and Chromium software GPU
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Package WebGL, current PBR terrain and 3D scenery
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          mkdir -p dist/src
          cp -a src/assets dist/src/assets
          node scripts/generate-oasis-adobe-glbs.mjs dist/src/assets/reborn/oasis-village
      - name: True WebGL2 lagoons, flowing creeks, verified pixel artifacts
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-cinematic-desert-water-20261120.spec.mjs --config=playwright.config.mjs
      - name: Preserve actual rendered screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-cinematic-desert-lakes-rivers
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
