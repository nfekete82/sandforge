name: Sandforge AI 4.3 verified canyon siege pass A/B
on:
  push:
    branches:
      - feat/sandforge-ai43-verified-siege-pass-20261120
  workflow_dispatch:
concurrency:
  group: sandforge-ai43-siege-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real-canyon-siege:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - map: 26
            seed: 824836862
            label: canyon-trap
          - map: 26
            seed: 9999
            label: open-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile and run guarded terrain + bomber regressions
        run: |
          npx tsc -p tsconfig.json
          node --test tests/sandforge-ai40-rally-recovery-20261120.test.mjs
          node --test tests/sandforge-ai43-verified-siege-pass-20261120.test.mjs
          node --test tests/sandforge-ai40-canyon-mission-20261120.test.mjs
          node --test tests/sandforge-ai42-canyon-air-siege-20261120.test.mjs
          node --test tests/sandforge-ai36-terrain-routes-20261119.test.mjs
      - name: Run real 480-second three-opponent paired battles
        run: |
          mkdir -p reports
          node scripts/benchmark-sandforge-ai38-combat.mjs \
            --maps ${{ matrix.map }} \
            --seeds ${{ matrix.seed }} \
            --opponents guarded,contesting,bastion-rush \
            --seconds 480 \
            --output reports/ai43-${{ matrix.label }}.json
      - name: Verify economy navigation and previous real victories
        run: |
          node scripts/check-sandforge-ai39-canyon-report.mjs reports/ai43-${{ matrix.label }}.json
          node scripts/check-sandforge-ai40-offense-results.mjs reports/ai43-${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandforge-ai43-${{ matrix.label }}
          path: reports/ai43-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 30
