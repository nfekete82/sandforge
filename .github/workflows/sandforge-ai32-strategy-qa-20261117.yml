name: Sandforge AI 3.2 strategic pressure and Bastion defense
on:
  push:
    branches: [feat/sandforge-ai32-pressure-flanks-bastion-20261117]
  pull_request:
    branches: [feat/sandforge-supply-pbr-animated-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai32-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile simulation and validate WebGL imports
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --no-warnings --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      - name: AI 3.2 decisions and historical combat, defense and Bastion tests
        run: |
          node --test \
            tests/sandforge-ai32-multifront-20261117.test.mjs \
            tests/reborn-ai-combat-commit-20261109.test.mjs \
            tests/reborn-ai-fight-instead-of-flee-20261109.test.mjs \
            tests/sandforge-ai-home-defense-20261111.test.mjs \
            tests/reborn-bastion-defense.test.mjs \
            tests/reborn-ai3-bastion-rush-20261117.test.mjs \
            tests/reborn-ai-commit-ab-20261109.test.mjs \
            tests/reborn-bastion-priority-20261117.test.mjs \
            tests/sandforge-ai-antiarmor-air-defense-20261111.test.mjs
