name: Sandforge natural canyon art, planted oases and smaller wrecks
on:
  push:
    branches: [feat/sandforge-oasis-vegetation-authentic-mojave-rocks-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-and-art-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and all new JavaScript module syntax
        run: |
          npx tsc -p tsconfig.json
          node --check scripts/webgl-authentic-canyon-geology.js
          node --check scripts/webgl-landscape-network.js
          node --check scripts/webgl-canyon-pbr-outcrops.js
          node --check scripts/webgl-preview.js
          node --check scripts/webgl-desert-lake-vegetation-plan.js
          node --check scripts/webgl-desert-lake-vegetation-3d.js
          node --check scripts/webgl-oases.js
      - name: Deterministic cliffs, accessible passes, no river, planted lakes and smaller cars
        run: |
          node --test tests/sandforge-canyon-lakes-natural-art-20261120.test.mjs
          node --test tests/sandforge-desert-visual-regression-20261120.test.mjs
          node --test tests/sandforge-cinematic-desert-water-20261120.test.mjs
          node --test tests/sandforge-burned-sedan-3d-20261120.test.mjs
      - name: Audit packaged WebGL module graph without private local GLB dependencies
        run: SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
  canyon-chromium-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install real Chromium software WebGL2 and game dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Package real PBR textures and actual model geometry
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          mkdir -p dist/src
          cp -a src/assets dist/src/assets
          node scripts/generate-oasis-adobe-glbs.mjs dist/src/assets/reborn/oasis-village
      - name: Render high-detail natural canyon ledges on Mojave and gray Badlands
        env:
          SANDFORGE_BROWSER_CHANNEL: chromium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd tests/browser
          npx playwright test webgl-authentic-canyons-20261120.spec.mjs --config=playwright.config.mjs
      - name: Preserve canyon screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-authentic-canyons-lakes-20261120
          path: |
            tests/browser/artifacts/screenshots/
            tests/browser/artifacts/results.json
            tests/browser/artifacts/report/
            tests/browser/artifacts/runs/
          if-no-files-found: warn
          retention-days: 30
