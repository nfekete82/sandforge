name: Sandforge · Plateau unit navigation regression
on:
  push:
    branches:
      - fix/plateau-unit-navigation-20261122
  pull_request:
    branches:
      - main
    paths:
      - src/reborn/world.ts
      - src/reborn/simulation.ts
      - tests/sandforge-plateau-unit-navigation-20261122.test.mjs
      - tests/sandforge-player-cliff-recovery-20261122.test.mjs
      - .github/workflows/sandforge-plateau-unit-navigation-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Plateau corner, steep tank goal and player stall recovery
        run: |
          node --test \
            tests/sandforge-plateau-unit-navigation-20261122.test.mjs \
            tests/sandforge-player-cliff-recovery-20261122.test.mjs
      - name: Existing exact-cell cliff and clearance regression checks
        # The historical artillery save/load deepEqual test fails on main
        # (run 45028858813) due optional undefined factoryService fields.
        # It is not a navigation failure and stays in the full CI suite.
        run: |
          node --test --test-name-pattern='navigation: (a subpixel|clearance probes|returned vehicle routes|unobstructed)' \
            tests/reborn-navigation-clearance.test.mjs
      - name: Existing physical tank escape, plateau ramp and frame-budget regressions
        run: |
          node --test \
            tests/sandforge-tank-cliff-exit-20261119.test.mjs \
            tests/sandforge-central-four-ramp-mesas-v10-20261121.test.mjs \
            tests/sandforge-221s-path-hitch-regression-20261119.test.mjs
