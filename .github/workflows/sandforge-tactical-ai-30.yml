name: Sandforge Tactical AI 3.0 - learning and overrun
on:
  push:
    branches:
      - feat/sandforge-tactical-ai-30-*
  pull_request:
    paths:
      - 'src/reborn/battle-learning.ts'
      - 'src/reborn/tactical-ai.ts'
      - 'tests/reborn-tactical-ai-30.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Compile and audit WebGL imports without local Mac-only PBR artifacts
        run: |
          npx tsc -p tsconfig.json
          SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
          node --no-warnings --experimental-vm-modules scripts/check-webgl-module-graph.mjs
      # Legacy commander/combat-missions fixtures are retained as archived
      # scenarios. Their 4-sector movement/mission assumptions do not match
      # modern Bastion maps; use the current 3.2 tactical tests below instead.
      - name: Targeted AI 3.0 and AI 2.5 policy regression
        run: node --test tests/reborn-tactical-ai-30.test.mjs tests/reborn-tactical-ai-25.test.mjs tests/reborn-tactical-ai-24.test.mjs
      - name: Relevant modern AI and Bastion regressions
        run: |
          node --test \
            tests/sandforge-ai32-multifront-20261117.test.mjs \
            tests/reborn-ai3-bastion-rush-20261117.test.mjs \
            tests/reborn-bastion-priority-20261117.test.mjs \
            tests/reborn-ai-combat-commit-20261109.test.mjs \
            tests/reborn-bastion-defense.test.mjs
