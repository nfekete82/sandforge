name: Build animated Sandforge soldier (one-time)
on:
  push:
    branches: [feat/lowpoly-soldier-rig-animations-20261115]
    paths: [.github/workflows/build-animated-lowpoly-soldier-20261115.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rig:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender for skeletal rig + GLB animation
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender -b --version | head -n 2
      - name: Rig imported low-poly character; export six skeletal actions
        run: |
          blender -b -t 2 --python scripts/rig_lowpoly_soldier.py -- \
            src/assets/meshy/infantry.glb src/assets/meshy/infantry-animated.glb
      - name: Validate glTF skinning/animations and original textures
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const f=readFileSync('src/assets/meshy/infantry-animated.glb');
          assert.equal(f.toString('ascii',0,4),'glTF');
          assert.equal(f.readUInt32LE(4),2);
          assert.equal(f.readUInt32LE(8),f.length);
          const json=JSON.parse(f.subarray(20,20+f.readUInt32LE(12)).toString('utf8'));
          assert.ok(json.skins?.length>0,'no glTF skin');
          assert.ok(json.nodes?.some(n=>n.skin!=null),'no skinned mesh node');
          assert.ok(json.skins[0].joints.length>=18,'incomplete rig');
          assert.ok(json.nodes.some(n=>n.name==='WeaponMuzzle'),'missing animated muzzle marker');
          const actions=new Set((json.animations||[]).map(a=>a.name));
          for(const a of ['Idle','Walk','Run','Attack','Hit','Death'])
            assert.ok(actions.has(a),'missing animation '+a+'; got '+[...actions]);
          assert.ok(json.materials?.length>0);
          assert.ok(json.images?.length>0,'authored soldier camouflage texture lost');
          const report=JSON.parse(readFileSync('src/assets/meshy/infantry-animated.report.json','utf8'));
          console.log('Rig OK',report,'clips:',[...actions],'size:',f.length);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test runtime loading, factions, previews, and animation hooks
        run: node --test tests/webgl-lowpoly-soldier-20261115.test.mjs tests/meshy-import.test.mjs tests/stylized-pack.test.mjs
      - name: Build Sandforge and validate shipped animation
        run: |
          npm run build:3d
          cmp src/assets/meshy/infantry-animated.glb dist/src/assets/meshy/infantry-animated.glb
      - name: Persist approved rigged GLB and metadata
        run: |
          set -euo pipefail
          mkdir -p docs
          cp src/assets/meshy/infantry-animated.report.json docs/LOWPOLY_SOLDIER_RIG_REPORT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/meshy/infantry-animated.glb docs/LOWPOLY_SOLDIER_RIG_REPORT.json
          git commit -m "asset(soldier): add rigged low-poly GLB with 6 playable clips"
          git push origin HEAD:feat/lowpoly-soldier-rig-animations-20261115
