name: Sandforge desert · disconnected tracks not Bastion highways
on:
  push:
    branches:
      - feat/sandforge-discontinuous-desert-tracks-20261122
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desert-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build current visual WebGL and real physical terrain
        run: npm run build
      - name: Verify no roads point to Bastions or cross mountain slopes
        run: node --test tests/sandforge-discontinuous-desert-tracks-20261122.test.mjs
      - name: Keep physical plateau ramps and historical save formats
        run: node --test tests/sandforge-central-four-ramp-mesas-v10-20261121.test.mjs tests/sandforge-desert-strike-natural-cliffs-20261122.test.mjs
