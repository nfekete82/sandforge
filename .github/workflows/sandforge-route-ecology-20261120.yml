name: Sandforge 4 deserts - route and scenery A/B verification
on:
  push:
    branches: [feat/sandforge-desert-route-ecology-polish-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Compile TS without private local-only building GLBs
        run: npx tsc -p tsconfig.json
      - name: Check real asset placement, map safety and historical navigation
        run: |
          node --check scripts/webgl-desert-ecoregion-plan.js
          node --test tests/sandforge-desert-route-ecology-polish-20261120.test.mjs
          node --test tests/sandforge-desert-ai-navigation-20261120.test.mjs
          node --test tests/sandforge-desert-ecoregions-20261120.test.mjs
      - name: Verify WebGL module graph without private building reconstruction
        run: SANDFORGE_MODULE_AUDIT=1 node scripts/build.mjs
  paid-480s-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: [baseline, candidate]
        preset: [desert-strike, broken-empire, burning-horizon, last-stronghold]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'baseline' && 'b195cfe3da21cbdc431cfb80a5d7c92da312e11e' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json
      - name: Same map, seed, fog and paid doctrines - measure wins and stalls
        run: |
          mkdir -p reports
          node scripts/benchmark-sandforge-ai38-combat.mjs \
            --presets ${{ matrix.preset }} \
            --variants calibrated \
            --opponents guarded,contesting,bastion-rush \
            --seconds 480 \
            --output reports/${{ matrix.version }}-${{ matrix.preset }}.json
      - name: Preserve battle metrics for paired decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandforge-${{ matrix.version }}-${{ matrix.preset }}
          path: reports/${{ matrix.version }}-${{ matrix.preset }}.json
          retention-days: 30
          if-no-files-found: warn
